name: Release AI Usage Tray
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '빌드할 기존 릴리스 태그 (예: v0.1.0)'
        required: true
        type: string
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    env:
      RUSTUP_TOOLCHAIN: 1.93.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Install test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gjs gnome-shell-common libglib2.0-bin
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Validate release version
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[0].version')
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$RELEASE_TAG" = "v$version"
          test "$(jq -r '.["version-name"]' extension/metadata.json)" = "$version"
      - name: Test and build
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$RELEASE_ARCH"
          cargo test --locked
          gjs -m tests/test_display.js
          cargo build --release --locked
          test "v$(./target/release/ai-usage-tray --version)" = "$RELEASE_TAG"
          mkdir dist
          cp target/release/ai-usage-tray "dist/ai-usage-tray-linux-$RELEASE_ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-usage-tray-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ai-usage-tray-linux-*
          merge-multiple: true
          path: dist
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          repo="$GITHUB_REPOSITORY"
          if draft=$(gh release view "$tag" -R "$repo" --json isDraft -q .isDraft); then
            if [[ "$draft" == false ]]; then
              echo "Release $tag is already public."
              exit 0
            fi
          else
            gh release create "$tag" -R "$repo" --verify-tag --draft --title "$tag" --generate-notes
          fi
          gh release upload "$tag" -R "$repo" --clobber dist/ai-usage-tray-linux-{x86_64,aarch64}
          gh release edit "$tag" -R "$repo" --draft=false --latest
